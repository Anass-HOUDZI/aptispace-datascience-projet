name: CI Compilation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Autorise le push automatique des commits par GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update repository URL for forks dynamically
        run: |
          CURRENT_REPO="${{ github.repository }}"
          echo "Current Repository detected: $CURRENT_REPO"
          
          # Remplace l'URL du dépôt parent par celle du dépôt actuel (fork) dans le fichier source
          sed -i "s|aptitek/aptispace-datascience-projet|$CURRENT_REPO|g" report/rapport.qmd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Go-Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Compile Notebooks and Render Quarto Report
        run: |
          task render
          task install-guide

      - name: Prepare Artifacts for Release
        run: |
          # Création des archives
          zip -r logs.zip logs/
          zip -r sources.zip src/
          zip -r notebooks.zip report/notebooks/
          
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière Compilation (Automatique)
          body: Rapports et codes compilés automatiquement par le pipeline CI/CD.
          make_latest: true
          files: |
            logs.zip
            sources.zip
            notebooks.zip
            report/rapport.html
            report/rapport.pdf
            report/README.md
            report/INSTALL.md
